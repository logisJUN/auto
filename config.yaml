# =========================================================================
# Bybit futures bot configuration
# Tune these instead of touching code. See README.md for what each does.
# =========================================================================

exchange:
  category: "linear"          # USDT perpetual futures
  # Always-watched symbols, regardless of the dynamic universe scan below.
  symbols: ["BTCUSDT", "ETHUSDT"]
  # Instead of (or in addition to) a hand-picked symbol list, periodically scan
  # every Bybit USDT linear perpetual and watch whichever ones currently have
  # the highest 24h turnover (liquidity) -- one cheap bulk ticker call, not a
  # kline fetch per candidate. A position that's open when its symbol falls out
  # of the refreshed list keeps being managed (SL/TP/trailing/stale-timeout)
  # until it closes -- it's just not eligible for new entries anymore.
  universe:
    enabled: false
    top_n: 30
    rescan_interval_hours: 1
    # some newly-listed/lower-liquidity perpetuals charge double the standard
    # ~0.055% taker fee -- exclude anything above this rate regardless of how
    # much turnover it has (a structural drag on every round trip). Symbols
    # filtered out are backfilled from the next-highest-turnover candidates.
    max_taker_fee_rate: 0.0006

risk:
  # margin allocated per position, as % of account equity. Position notional =
  # equity * position_size_pct_of_equity / 100 * leverage.
  # NOTE: unlike a risk-per-trade-% scheme, the loss if SL is hit is NOT fixed to
  # a set % of equity here -- it depends on leverage and stop-loss distance.
  # At 50% with no margin_buffer_pct reserve, the 2nd position gets whatever's
  # left of equity (the other 50%) -- both symbols get a full allocation.
  position_size_pct_of_equity: 50.0
  # always keep at least this % of equity as an unused margin reserve. A new
  # position's margin is capped to min(position_size_pct_of_equity% of equity,
  # remaining headroom under this reserve) -- so it's sized down (or skipped)
  # instead of the exchange rejecting the order for insufficient available
  # balance once other positions have already committed margin.
  # Set to 0: no reserve -- the 2nd position gets 100% of whatever equity the
  # 1st didn't use, not headroom shrunk by a buffer on top of that.
  margin_buffer_pct: 0.0
  # if every slot is full (or margin headroom is gone) but a NEW trend signal on
  # some other symbol comes in strong, close the weakest currently-held position
  # and take that trade instead of just sitting out. "Weakest" = lowest current
  # (not entry-time) confidence in its own direction; a position whose signal has
  # faded to neutral or reversed scores lowest and is replaced first.
  override_entry:
    enabled: true
    # the new candidate must have at least this much confidence to be allowed
    # to displace an existing position at all.
    min_confidence: 0.85
    # ...and must beat the weakest held position's current confidence by at
    # least this much (not just be marginally better).
    min_confidence_margin_over_weakest: 0.15
  # hard cap on leverage the bot will ever request, regardless of signal confidence.
  # only used as a fallback if default_leverage_range below is missing entirely.
  max_leverage: 5
  # per-symbol leverage range [min, max]. Actual leverage used for a trade is
  # interpolated within this range based on signal confidence (low confidence ->
  # min, high confidence -> max), then capped by the exchange's own max leverage
  # for that symbol/margin tier.
  leverage_by_symbol:
    BTCUSDT: {min: 10, max: 15}
    ETHUSDT: {min: 10, max: 15}
  # leverage range for any symbol NOT listed in leverage_by_symbol above -- i.e.
  # everything picked up by the dynamic universe scan.
  default_leverage_range: {min: 5, max: 8}
  # bot stops opening new trades for the day once realized loss hits this % of
  # the equity it had at the start of the day (UTC).
  max_daily_loss_pct: 8.0
  # bot stops opening new trades once this many are open at the same time.
  max_concurrent_positions: 4
  # minimum aggregated confidence (0-1) required to open a position at all.
  min_confidence_to_enter: 0.55
  # minimum notional order size in quote currency (USDT). Trades smaller than
  # this are skipped rather than sent (avoids exchange min-qty rejects).
  min_order_notional_usdt: 5.0

signals:
  weights:
    technical: 0.45
    volume: 0.15
    news: 0.20
    polymarket: 0.20
  technical:
    timeframes: ["15", "60", "240"]   # minutes; last one weighted heaviest (trend filter)
    rsi_period: 14
    ema_fast: 12
    ema_slow: 26
    atr_period: 14
    kline_limit: 200
    # candles (on the shortest configured timeframe) used to find the recent
    # trading-range high/low for range_trade below.
    range_lookback: 20
  news:
    feeds:
      - "https://www.coindesk.com/arc/outboundfeeds/rss/"
      - "https://cointelegraph.com/rss"
      - "https://cryptoslate.com/feed/"
    refresh_minutes: 15
    lookback_hours: 12
    max_articles: 60
  polymarket:
    keywords: ["bitcoin", "ethereum", "crypto", "fed ", "interest rate", "recession"]
    refresh_minutes: 15
    max_markets: 40

trade_management:
  # initial stop distance = atr * this multiplier
  atr_sl_multiplier: 1.5
  # initial take-profit distance = atr * this multiplier
  atr_tp_multiplier: 2.5
  # once unrealized profit reaches this multiple of the initial risk (R),
  # start trailing (move SL to breakeven and beyond).
  breakeven_after_rr: 0.5
  trail_activation_rr: 1.0
  # how far (in ATR) to push SL behind price once trailing is active.
  trail_atr_multiplier: 1.2
  # if signals/momentum still strongly favor the position when price nears TP,
  # extend TP outward by this many ATR instead of taking profit immediately.
  tp_extend_atr_step: 0.75
  # only extend TP this many times per trade, to avoid never taking profit.
  max_tp_extensions: 3
  # emergency exit: if price moves against the position within
  # flash_move_window_sec by at least flash_move_atr_mult x (that position's
  # entry-time ATR as a % of entry price), close immediately at market
  # regardless of SL. Scales with each symbol's own volatility instead of one
  # fixed % for every symbol -- a fixed % can let a highly volatile coin drift
  # a long way before ever firing, while being needlessly twitchy on a calm
  # one. Clamped to [flash_move_min_pct, flash_move_max_pct] either way.
  flash_move_atr_mult: 1.0
  flash_move_min_pct: 0.8
  flash_move_max_pct: 3.0
  flash_move_window_sec: 45
  # if the fast signal flips hard against an open position (score crosses
  # this magnitude opposite to position side) with decent confidence, exit early.
  reversal_exit_score: 0.4
  reversal_exit_confidence: 0.6
  # "give up" exit: if a position has been open at least this long AND price is
  # still within stale_exit_max_move_pct of entry, close it (profit or loss) and
  # free the slot for a fresh signal on another symbol. 0 disables this check.
  # Closing a truly flat position is a guaranteed small loss from round-trip
  # fees alone -- only worth rushing into when that capital is actually needed.
  # stale_exit_after_min applies when every slot/margin is currently in use;
  # stale_exit_after_min_no_pressure (much longer) applies when there's free
  # room and nothing is waiting on this position's capital.
  stale_exit_after_min: 60
  stale_exit_after_min_no_pressure: 240
  stale_exit_max_move_pct: 0.5

  # Range/mean-reversion scalp entries, only tried when the trend signal
  # (technical+news+polymarket) is neutral. Enter long near the recent range
  # low / short near the recent range high, at the symbol's max configured
  # leverage, for a quick scalp -- no trailing or TP-extension, exits only via
  # its own (tight) SL/TP plus the shared flash-move/reversal/stale-timeout checks.
  range_trade:
    enabled: true
    # how close to the range high/low (in ATR) counts as "at the edge".
    edge_atr_mult: 0.5
    # a neutral aggregate signal doesn't by itself mean price is actually
    # ranging -- it can also happen mid-trend when sub-signals disagree. Only
    # treat it as a real range if the high-low width over range_lookback
    # candles is no more than this many ATR; a wider band means the market is
    # trending/expanding, not consolidating, and range trades are skipped.
    max_range_width_atr_mult: 4.0
    # tighter SL/TP than trend trades -- this is meant to be a quick scalp.
    atr_sl_multiplier: 1.0
    atr_tp_multiplier: 1.0

loop:
  fast_poll_sec: 8          # price/emergency-exit checks while a position is open
  idle_poll_sec: 20         # checks while flat, waiting for an entry signal
  signal_refresh_sec: 30    # how often to recompute the full multi-factor signal

dashboard:
  enabled: true
  host: "0.0.0.0"
  port: 8080
