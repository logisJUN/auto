services:
  - type: web
    name: bybit-bot
    runtime: python
    # Starter plan: never sleeps (no UptimeRobot needed), and supports the
    # persistent disk below so data/state.json and logs/decisions.jsonl
    # survive redeploys/restarts instead of resetting every time -- needed for
    # the dashboard's performance-review history to actually accumulate.
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn render_app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BYBIT_API_KEY
        sync: false
      - key: BYBIT_API_SECRET
        sync: false
      - key: BYBIT_TESTNET
        value: "true"
      - key: NEWSAPI_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DASHBOARD_TOKEN
        sync: false
      - key: DATA_DIR
        value: /var/data/data
      - key: LOG_DIR
        value: /var/data/logs
    disk:
      name: bybit-bot-data
      mountPath: /var/data
      sizeGB: 1
